<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국어 심화 학습 · 훈민정음과 음운</title><style>:root{--bg:#f4f6f2;--ink:#1d3025;--g:#276044;--line:#dce7dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 system-ui,"Apple SD Gothic Neo",sans-serif}main{max-width:960px;margin:auto;padding:16px 18px 90px}.hero{background:linear-gradient(135deg,#183b2b,#3b7653);border-radius:24px;color:white;padding:36px;margin:10px 0 20px}h1{font-size:clamp(28px,5vw,48px);line-height:1.2;margin:10px 0}h2{font-size:23px;margin:6px 0 12px}h3{font-size:18px;margin:0 0 12px}.muted{color:#75877b;font-size:13px}.hero p{color:#d9eadf}nav{position:sticky;top:0;display:flex;gap:8px;flex-wrap:wrap;background:var(--bg);padding:12px 0;z-index:2}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:white;border-radius:11px;padding:10px 14px;color:var(--ink)}button.active,.primary{background:var(--g);color:white;border-color:var(--g)}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:23px;margin:14px 0;box-shadow:0 8px 30px #13392209}.tag{font-size:12px;letter-spacing:.12em;font-weight:800;color:#699278}.tip{background:#eaf3eb;padding:13px 16px;border-radius:11px;margin:15px 0}.choices{display:grid;gap:9px}.choice{text-align:left}.choice.selected{background:#e3f2e6;border-color:#2e7147}.essay{width:100%;min-height:105px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:13px;font:inherit}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#eaf3eb;border-radius:12px;padding:12px;text-align:center}.stat b{display:block;font-size:23px}.feedback{border-left:4px solid #e1b86b;background:#faf7ed;padding:13px;margin:13px 0}.good{border-color:#53a270;background:#e9f5ec}.bad{border-color:#ce836c;background:#fff0e9}.bar{height:9px;background:#e0e8e1;border-radius:20px;overflow:hidden}.fill{height:100%;background:#408b5d;width:0}.small{font-size:13px}a{color:#236342}@media(max-width:600px){.hero{padding:27px 22px}.card{padding:18px}nav button{flex:1;padding:8px;font-size:13px}.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:18px}}</style></head><body><main><div class="hero"><div class="tag" style="color:#bfe2c7">KOREAN EXAM LAB · EXPANDED</div><h1>훈민정음과 음운 체계<br>완전 정복</h1><p>교과서 사진 10장 반영 · 14개 상세 노트 · 난도별 24문항씩 총 72문항 · 서술형 부분점수</p></div><nav><button onclick="tab('notes')" id="n-notes" class="active">📖 개념 노트</button><button onclick="tab('exam')" id="n-exam">✍️ 실전 시험</button><button onclick="tab('result')" id="n-result">📊 채점 결과</button></nav><div id="notes"><div class="card"><h2>교과서·필기 추가 정리</h2><p>기존 노트에서 빠졌던 가획자·이체자·연서, 모음의 초출·재출, 정보화 시대의 가치, 음운과 길이를 사진에 맞춰 추가했어.</p></div><div id="notelist"></div></div><div id="exam" class="hidden"><div class="card"><h2>시험 난도 선택</h2><div id="levelbuttons" style="display:flex;gap:8px;flex-wrap:wrap"></div><p class="muted">각 난도 24문항: 객관식 12개 + 서술형 12개. 난도별 답안과 점수는 별도로 저장돼.</p><div class="bar"><div class="fill" id="fill"></div></div><p class="small" id="count"></p></div><div id="qlist"></div><div class="card"><button class="primary" onclick="submit()">시험 제출 · 자동 채점</button><button onclick="reset()">현재 난도 답안 초기화</button></div></div><div id="result" class="hidden"><div class="card" id="report"><h2>성적표</h2>시험을 제출하면 확인할 수 있어.</div></div></main><script>const DATA={"notes":[["자음 기본자와 상형","ㄱ은 혀뿌리가 목구멍을 막는 모양, ㄴ은 혀끝이 윗잇몸에 닿는 모양, ㅁ은 입 모양, ㅅ은 이의 모양, ㅇ은 목구멍 모양을 본떴다. 다섯 기본자는 발음 기관의 모양을 본뜬 상형 원리로 만들어졌다."],["자음 가획자와 이체자","가획은 기본자에 획을 더해 만든다. ㄱ→ㅋ, ㄴ→ㄷ→ㅌ, ㅁ→ㅂ→ㅍ, ㅅ→ㅈ→ㅊ, ㅇ→ㆆ→ㅎ 등이 해당한다. 가획자는 대체로 소리가 세지는 방향으로 설명한다. 이체자 ㆁ·ㄹ·ㅿ은 기본자에 획을 더한 가획자와 구별한다. 사진 필기에도 이체자와 가획자의 차이를 강조했다."],["병서와 연서","병서는 자음자를 가로로 나란히 쓰는 방법이다. 예: ㄲ, ㄸ, ㅃ, ㅆ, ㅉ, ㆅ. 연서는 자음자를 세로로 이어 쓰는 방법이다. 예: ㅱ, ㅸ 등 옛 글자. 병서는 기본자에 해당하지 않는다. 합용병서·각자병서의 세부 유형은 수업 범위에 따라 판단한다."],["모음 기본자와 상형","ㆍ는 하늘의 둥근 모양, ㅡ는 땅의 평평한 모양, ㅣ는 사람이 서 있는 모양을 본떴다. 자음 기본자는 발음 기관을 본떴지만 모음 기본자는 천·지·인을 본떴다. 모두 상형의 원리라는 공통점이 있다."],["모음 초출자·재출자","초출자는 ㆍ를 ㅡ 또는 ㅣ에 한 번 결합하여 만든 ㅗ·ㅜ·ㅏ·ㅓ이다. 재출자는 초출자에 ㆍ를 다시 더하여 만든 ㅛ·ㅠ·ㅑ·ㅕ이다. 사진에 나온 수업 정리에서 초출자와 재출자를 구별하고, 합성과 합용을 혼동하지 말라고 강조했다."],["모음 합성·합용과 83쪽","합성은 모음의 기본자를 결합해 초출자 등을 만드는 원리이고, 합용은 이미 만들어진 모음자를 서로 결합하여 다른 모음자를 적는 방식이다. 사진의 예로 ㅗ+ㅏ→ㅘ, ㅜ+ㅣ→ㅟ, ㅗ+ㅣ→ㆎ 등을 비교할 수 있다. 특히 교과서 83쪽 활동에는 아래아 ㆍ가 포함되어 있으므로 모두 합용의 원리라고 답하면 안 된다."],["풀어쓰기와 모아쓰기","풀어쓰기는 초성·중성·종성 소리를 차례로 풀어서 쓰는 방식이다. 모아쓰기는 초성·중성·종성을 음절 단위로 모아서 쓰는 방식이다. 모아쓰기는 문장을 편하게 읽고 뜻을 파악하기 좋다. 음절에는 모음이 반드시 필요하며, 초성과 종성만으로 음절을 만들 수 없다."],["한글의 과학성·독창성·실용성","과학성: 발음 기관과 천·지·인의 모양을 본떠 체계적으로 만들었다. 독창성: 다른 문자를 그대로 빌린 것이 아니라 독자적인 창제 원리가 있다. 실용성: 적은 글자로 수많은 소리를 표현하고 배우고 사용하기 쉽다. 사진 85쪽의 세 항목과 수업 필기를 반영했다."],["디지털·정보화 시대의 가치","사진 87쪽의 세 근거: ① 한글의 창제 원리가 자판에도 적용되어 문자를 빠르게 입력할 수 있다. ② 음절 단위로 모아쓰기를 하므로 정보 전달에 유리하다. ③ 문자와 소리가 대부분 일치하여 음성 인식이 유리하다. 이를 한글의 발전 방향과 연결해 설명할 수 있다."],["한글의 발전 방향","한글을 사랑하는 마음을 기르고 바르게 사용한다. 한글의 가치를 인식하고 지속적으로 발전시키며 지켜 나갈 방법을 모색한다. 사진의 활동 예: 외국인 친구에게 한글에 관한 정확한 정보를 알려 주기. 한글은 문자, 한국어는 언어라는 차이도 유지한다."],["음운의 개념과 종류","말소리는 사람의 발음 기관을 통해 내는 구체적인 소리다. 음운은 말의 뜻을 구별해 주는 소리의 가장 작은 단위다. 음운에는 자음과 모음이 있고 말소리의 길이도 뜻을 구별할 수 있다. 사진 94쪽에서 봄/곰, 봄/밤을 비교하며 음운 차이를 설명한다."],["최소 대립쌍과 말소리 길이","곰/몸은 ㄱ과 ㅁ 하나만 다르므로 최소 대립쌍이다. 달/딸도 ㄷ과 ㄸ 한 음운 차이다. 곰/밤은 ㄱ/ㅂ과 ㅗ/ㅏ 두 음운이 다르므로 최소 대립쌍이 아니다. 밤(夜)/밤(栗)은 소리의 길이에 따라 뜻이 달라질 수 있다. 다만 수업에서 개별 장단 판별 문제는 내지 않는다고 안내했다."],["자음 체계","발음 위치: 양순음 ㅂㅃㅍㅁ, 치조음 ㄷㄸㅌㅅㅆㄴㄹ, 경구개음 ㅈㅉㅊ, 연구개음 ㄱㄲㅋㅇ, 후음 ㅎ. 발음 방법: 파열음 ㄱㄲㅋ·ㄷㄸㅌ·ㅂㅃㅍ, 파찰음 ㅈㅉㅊ, 마찰음 ㅅㅆㅎ, 비음 ㅁㄴㅇ, 유음 ㄹ. 비음과 유음은 울림소리인 자음이다."],["모음 체계","모음은 단모음과 이중모음으로 나뉜다. 단모음의 세 분류 기준은 혀의 앞뒤 위치(전설/후설), 혀의 높이(고/중/저), 입술 모양(원순/평순)이다. 고모음 ㅣ·ㅟ·ㅡ·ㅜ, 중모음 ㅔ·ㅚ·ㅓ·ㅗ, 저모음 ㅐ·ㅏ. 입술을 둥글게 하는 원순모음에는 ㅟ·ㅚ·ㅜ·ㅗ가 포함된다."]],"levels":{"base":{"name":"기본","mc":[["자음 기본자의 창제 원리로 알맞은 것은?",["발음 기관 상형","천지인 상형","외국 문자 차용","획수의 무작위 배열"],0,"자음 기본자는 발음 기관의 모양을 본떴다."],["모음 기본자와 상징의 연결이 옳은 것은?",["ㆍ-땅","ㅡ-사람","ㅣ-사람","ㅣ-하늘"],2,"ㅣ는 사람이 서 있는 모양이다."],["다음 중 이체자는?",["ㅋ","ㅌ","ㄹ","ㅊ"],2,"ㄹ은 이체자이며 다른 보기는 가획자다."],["초출자로만 묶인 것은?",["ㅗㅜㅏㅓ","ㅛㅠㅑㅕ","ㅘㅝㅢㅚ","ㆍㅡㅣㅗ"],0,"초출자는 ㅗㅜㅏㅓ이다."],["재출자로만 묶인 것은?",["ㅏㅓㅗㅜ","ㅛㅠㅑㅕ","ㅐㅔㅚㅟ","ㆍㅡㅣㅑ"],1,"재출자는 ㅛㅠㅑㅕ이다."],["병서의 설명으로 옳은 것은?",["기본자에 획을 더함","자음자를 나란히 씀","자음자를 세로로 이음","모음 기본자를 결합함"],1,"병서는 자음자를 나란히 쓰는 방식이다."],["모아쓰기의 단위는?",["음운","음절","어절","문장"],1,"모아쓰기는 음절 단위다."],["디지털 시대 한글의 가치로 사진 87쪽에 없는 것은?",["빠른 자판 입력","음절 단위 정보 전달","음성 인식의 유리함","모든 외국어 자동 번역"],3,"자동 번역은 사진의 세 근거에 포함되지 않는다."],["음운의 정의는?",["뜻을 구별하는 소리의 최소 단위","뜻을 가진 최소 단위","문장을 나누는 최소 단위","글자의 획을 세는 단위"],0,"음운은 뜻을 구별하는 소리의 가장 작은 단위다."],["최소 대립쌍인 것은?",["곰/밤","알/아들","달/딸","바다/하늘"],2,"달/딸은 한 음운만 다르다."],["비음만 있는 것은?",["ㄴㅁㅇ","ㄴㄹㅁ","ㅂㅁㅇ","ㄱㄴㅇ"],0,"비음은 ㄴㅁㅇ이다."],["원순모음으로만 묶인 것은?",["ㅣㅔㅐ","ㅡㅓㅏ","ㅗㅜㅚㅟ","ㅓㅗㅏㅐ"],2,"원순모음은 ㅗㅜㅚㅟ이다."]],"essay":[["자음 기본자와 모음 기본자의 상형 대상을 비교하시오.",["자음","발음 기관","모음","하늘"],"자음 기본자는 발음 기관을, 모음 기본자는 하늘·땅·사람을 본떴다."],["가획의 원리를 ㄴ·ㄷ·ㅌ으로 설명하시오.",["ㄴ","ㄷ","ㅌ","획"],"ㄴ에 획을 더해 ㄷ을 만들고, ㄷ에 획을 더해 ㅌ을 만든다."],["이체자와 가획자의 차이를 설명하시오.",["이체","가획","획"],"가획자는 기본자에 획을 더해 만들고, 이체자는 단순히 획을 더한 가획자와 구별되는 글자다."],["초출자와 재출자의 관계를 설명하시오.",["초출","재출","ㆍ"],"초출자는 기본자 결합으로, 재출자는 초출자에 ㆍ를 다시 더하여 만든다."],["합성과 합용의 차이를 쓰시오.",["합성","합용","결합"],"합성은 기본자를 결합해 모음자를 만들고, 합용은 만들어진 모음자를 서로 결합하여 적는 방식이다."],["83쪽 활동을 모두 합용이라 할 수 없는 이유를 쓰시오.",["아래아","합성"],"아래아(ㆍ)가 포함되어 기본자를 결합하는 합성 과정이 있기 때문이다."],["모아쓰기의 특징과 장점을 설명하시오.",["음절","모아","읽"],"초성·중성·종성을 음절 단위로 모아 쓰므로 읽고 뜻을 파악하기 편하다."],["한글의 과학성과 독창성을 구별해 설명하시오.",["과학","원리","독창"],"과학성은 체계적인 제자 원리이고 독창성은 다른 문자를 그대로 빌리지 않은 독자적 창제 원리다."],["디지털 시대 한글의 가치를 사진 87쪽에서 두 가지 쓰시오.",["자판","입력","음성"],"한글의 창제 원리가 자판에 적용되어 입력이 빠르고 문자와 소리가 대부분 일치하여 음성 인식에 유리하다."],["한글과 한국어의 차이를 쓰시오.",["한글","문자","한국어","언어"],"한글은 문자이고 한국어는 언어다."],["음운의 정의를 쓰고 예를 드시오.",["뜻","구별","소리"],"음운은 뜻을 구별하는 소리의 최소 단위다. 곰과 몸은 ㄱ/ㅁ으로 뜻이 구별된다."],["곰/밤이 최소 대립쌍이 아닌 이유를 쓰시오.",["두","음운","ㄱ","ㅗ"],"ㄱ/ㅂ과 ㅗ/ㅏ의 두 음운이 달라 최소 대립쌍이 아니다."]]},"hard":{"name":"고난도","mc":[["가획자에 대한 설명 중 틀린 것은?",["기본자에 획을 더한다","ㅋ은 ㄱ의 가획자다","ㄹ은 ㄴ의 가획자다","ㅊ은 ㅈ에 획을 더해 만든다"],2,"ㄹ은 이체자다."],["초출자와 재출자의 관계로 적절한 것은?",["재출자는 기본자에 ㆍ를 한 번 더한 글자다","재출자는 초출자에 ㆍ를 다시 더해 만든다","초출자는 재출자 두 개를 합친다","둘은 같은 범주다"],1,"재출자는 초출자에 ㆍ를 다시 더한다."],["다음 중 합용과 합성을 구분 er(){let L=DATA.levels[level],r=record();document.getElementById("levelbuttons").innerHTML=Object.keys(DATA.levels).map(k=>'<button class="'+(level===k?"active":"")+'" onclick="changeLevel(\''+k+'\')">'+DATA.levels[k].name+'</button>').join("");let q=document.getElementById("qlist");q.innerHTML="";L.mc.forEach((x,i)=>{let c=document.createElement("div");c.className="card";c.innerHTML='<div class="tag">객관식 '+(i+1)+'</div><h3>'+x[0]+'</h3><div class="choices"></div>';x[1].forEach((opt,j)=>{let b=document.createElement("button");b.className="choice"+(r.a[i]===j?" selected":"");b.textContent=(j+1)+". "+opt;b.disabled=r.submitted;b.onclick=()=>{r.a[i]=j;save();render()};c.querySelector(".choices").append(b)});q.append(c)});L.essay.forEach((x,j)=>{let i=12+j,c=document.createElement("div");c.className="card";c.innerHTML='<div class="tag">서술형 '+(j+1)+' · 5점</div><h3>'+x[0]+'</h3><textarea class="essay" placeholder="근거와 개념을 문장으로 적어 봐."></textarea><p class="muted">핵심 요소별 부분점수 · 모범 답안 비교</p>';let t=c.querySelector("textarea");t.value=r.a[i]||"";t.disabled=r.submitted;t.oninput=()=>{r.a[i]=t.value;save();progress()};q.append(c)});progress()}function progress(){let a=record().a,n=a.filter(x=>x!==null&&String(x).trim()!=="").length;document.getElementById("count").textContent=n+" / 24문항 답변";document.getElementById("fill").style.width=(n/24*100)+"%"}function changeLevel(k){level=k;render()}function norm(s){return String(s||"").replace(/\s/g,"").toLowerCase()}function scoreEssay(a,keys){if(!String(a||"").trim())return 0;let hits=keys.filter(k=>norm(a).includes(norm(k))).length;return Math.round(5*hits/keys.length*10)/10}function submit(){let r=record();if(!r.submitted){let n=r.a.filter(x=>x!==null&&String(x).trim()!=="").length;if(n<24&&!confirm("미응답 "+(24-n)+"문항이 있어. 제출할까?"))return;r.submitted=true;save();render()}tab("result")}function reset(){if(!confirm("현재 난도 답안과 점수를 초기화할까?"))return;delete state[level];save();render()}function report(){let L=DATA.levels[level],r=record(),el=document.getElementById("report");if(!r.submitted){el.innerHTML="<h2>성적표</h2><p>"+L.name+" 시험을 제출하면 채점 결과가 표시돼.</p>";return}let mc=0,es=0;L.mc.forEach((q,i)=>{if(r.a[i]===q[2])mc++});L.essay.forEach((q,j)=>es+=scoreEssay(r.a[12+j],q[1]));let out='<div class="tag">'+L.name+' 시험 · 성적표</div><h2>채점 결과</h2><div class="stats"><div class="stat"><b>'+mc+'/12</b>객관식 정답</div><div class="stat"><b>'+es.toFixed(1)+'/60</b>서술형 참고점수</div><div class="stat"><b>'+Math.round((mc*5+es)/120*100)+'점</b>환산 점수</div></div><div class="tip"><b>채점 기준:</b> 객관식 5점×12, 서술형 5점×12. 서술형은 핵심 요소별로 부분점수를 줘. 동의어·다른 표현·논리적 타당성은 프로그램이 완전히 판별할 수 없으니 <b>참고 점수</b>야. 최고난도에서 요구하는 반례·논증의 질도 사람이 추가로 확인해야 해.</div><h3>객관식 정답과 해설</h3>';L.mc.forEach((q,i)=>{let ok=r.a[i]===q[2];out+='<div class="feedback '+(ok?"good":"bad")+'"><b>'+(i+1)+'. '+(ok?"정답":"오답")+'</b> '+q[0]+'<p>내 답: '+(r.a[i]===null?"미응답":q[1][r.a[i]])+'<br>정답: <b>'+q[1][q[2]]+'</b><br>'+q[3]+'</p></div>'});out+='<h3>서술형 부분점수와 모범 답안</h3>';L.essay.forEach((q,j)=>{let s=scoreEssay(r.a[12+j],q[1]),found=q[1].filter(k=>norm(r.a[12+j]).includes(norm(k)));out+='<div class="feedback '+(s>=4?"good":"")+'"><b>'+(j+1)+'. '+s.toFixed(1)+' / 5점</b> '+q[0]+'<p>내 답: '+String(r.a[12+j]||"미응답").replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</p><p><b>모범 답안:</b> '+q[2]+'</p><p class="muted">인식된 핵심 요소: '+(found.join(", ")||"없음")+' / 전체 '+q[1].join(", ")+'</p></div>'});el.innerHTML=out}render();</script></body></html>
